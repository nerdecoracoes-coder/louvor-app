# Publica o banco (migrações) e as Edge Functions no Supabase.
# Rode pela aba "Actions" do GitHub → "Publicar no Supabase" → "Run workflow" (funciona pelo celular).
# Secrets do repositório necessários (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   identificador do projeto (ex.: abcdefghijklmno)
#   SUPABASE_DB_PASSWORD   (só se for aplicar migrações) senha do banco
#   GOOGLE_SERVICE_ACCOUNT conteúdo completo do arquivo JSON da conta de serviço do Google
#   CRON_SECRET            uma senha longa qualquer (a mesma usada em supabase/setup/agendamento.sql)
name: Publicar no Supabase
on:
  workflow_dispatch:
    inputs:
      migrations:
        description: "Aplicar as migrações do banco (deixe desmarcado se o banco foi criado pelo SQL Editor)"
        type: boolean
        default: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Aplicar migrações
        if: ${{ inputs.migrations }}
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --password "$DB_PASSWORD"
      - name: Secrets das funções
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT" || { echo "Falta o secret GOOGLE_SERVICE_ACCOUNT"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Falta o secret CRON_SECRET"; exit 1; }
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('type')=='service_account' and d.get('private_key') and d.get('client_email'); print('Conta de serviço:', d['client_email'])"
          supabase secrets set --project-ref "$PROJECT_REF" GOOGLE_SERVICE_ACCOUNT="$GOOGLE_SERVICE_ACCOUNT" CRON_SECRET="$CRON_SECRET"
      - name: Publicar funções
        run: |
          supabase functions deploy drive-sync --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy drive-media --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
