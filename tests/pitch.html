<html><body><script>
window.run = async function (semi, freq) {
  const sr = 48000, secs = 3;
  const ctx = new OfflineAudioContext(2, sr * secs, sr);
  await ctx.audioWorklet.addModule("/app/player/pitch-worklet.js");
  const buf = ctx.createBuffer(2, sr * secs, sr);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = 0.5 * Math.sin(2 * Math.PI * freq * i / sr); }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const node = new AudioWorkletNode(ctx, "pitch-shift", { outputChannelCount: [2], processorOptions: { semitones: semi } });
  src.connect(node); node.connect(ctx.destination); src.start();
  const out = (await ctx.startRendering()).getChannelData(0);
  // estima a frequência por cruzamentos de zero na segunda metade
  const a = sr * 1.5, b = sr * 2.5; let z = 0, first = -1, last = -1;
  for (let i = a + 1; i < b; i++) if (out[i - 1] < 0 && out[i] >= 0) { z++; if (first < 0) first = i; last = i; }
  const f = (z - 1) * sr / (last - first);
  let rms = 0; for (let i = a; i < b; i++) rms += out[i] * out[i]; rms = Math.sqrt(rms / (b - a));
  return { f, rms };
};
</script></body></html>
